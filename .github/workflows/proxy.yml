name: proxy

on:
  push:
    paths: ["proxy/**", "test.sh", ".github/workflows/proxy.yml"]
  pull_request:
    paths: ["proxy/**", "test.sh", ".github/workflows/proxy.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: ./test.sh proxy
